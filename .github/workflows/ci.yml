name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Assemble app + smoke test
        run: |
          scripts/build-app.sh
          scripts/smoke-test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MuteBar-app
          path: .build/app/MuteBar.app
